{% extends "layout.html" %}
{% block title %}
  {% if title %}
    {{title}}
  {% else %}
    {{super()}}
  {% endif %}
{% endblock title %}
{% block content %}
  <div id="calendar-content"
    style="
      height: 100%;
    "
    {% if week %}
      hx-get="/calendar/week/content"
    {% else %}
      hx-get="/calendar/month/content"
    {% endif %}
    {% if calendar_params %}
      hx-vals='{
        "year": {{ calendar_params["year"] }},
        "month": {{ calendar_params["month"] }},
        "day": {{ calendar_params["day"] }}
      }'
    {% else %}
      hx-vals='js:{...function() {
        var today = new Date();
        var date_params = {
          "year": today.getFullYear(),
          "month": today.getMonth() + 1,
          "day": today.getDate()
        };
        return date_params;
      }()}'
    {% endif %}
    hx-target="#calendar-content"
    hx-trigger="load">
  </div>
{% endblock content %}
